<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Track Engineering Toolkit</title>
  <meta name="description" content="Track Engineering Toolkit — quick links to engineering sites" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🔧%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header wrap">
    <div class="brand">
      <h1>Track Engineering Toolkit</h1>
      <p class="tagline">A single landing page to navigate your engineering web apps</p>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <label for="search" class="visually-hidden">Filter sites</label>
        <input id="search" type="search" placeholder="Filter sites..." aria-label="Filter sites" />
        <div id="result-count" aria-live="polite" class="result-count"></div>
      </div>

      <button id="theme-toggle" class="theme-toggle" aria-pressed="false" title="Toggle color theme">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span class="visually-hidden">Toggle theme</span>
      </button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section id="grid" class="grid" aria-live="polite" aria-label="Sites grid">
      <!-- Cards injected by scripts.js -->
    </section>

    <noscript>
      <p class="noscript">JavaScript is required to load the list. You can view <a href="sites.json">sites.json</a> while scripting is disabled.</p>
    </noscript>
  </main>

  <footer class="site-footer wrap">
      <small>Built for easy editing · Deploy to Azure Static Web Apps or Azure Storage</small>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
